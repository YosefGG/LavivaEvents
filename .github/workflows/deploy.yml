name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html

      - name: Publish built assets to main branch root
        run: |
          rm -rf assets
          cp -r dist/assets assets
          for item in dist/*; do
            name=$(basename "$item")
            if [ "$name" != "index.html" ] && [ "$name" != "assets" ]; then
              rm -rf "$name"
              cp -r "$item" "$name"
            fi
          done
          cp dist/index.html 404.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets 404.html .nojekyll catalog favicon.svg hero-video.mp4 icons.svg laviva-logo.png 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Deploy built site to main [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
